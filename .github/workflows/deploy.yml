name: Deploy

# Continuous deployment on every push to main.
#
#   push to main  → check → deploy-api → deploy-web
#   pull request  → check only
#
# This deploys the TOP-LEVEL wrangler.jsonc config — i.e. the resources that
# already exist in the Cloudflare account (Worker `rag-api`, KV `RAG_KV`, D1
# `rag-db`, queues `ingest-queue`/`-dlq`) plus the `rag-web` Pages project.
# There is deliberately no `--env` flag: a single environment, deployed here,
# serving as the remote dev environment until a production one is split out.
#
# One-time setup (secrets, repo variables, R2) is documented in
# README → "Continuous deployment".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab without an empty commit.
  workflow_dispatch:

# Never let two deploys race: a queued run waits for the in-flight one instead
# of cancelling it, so a half-finished `wrangler deploy` is not interrupted.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the root package.json "packageManager" field.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # NON-BLOCKING for now. `apps/web` has 6 pre-existing
      # react-hooks/set-state-in-effect errors (api-keys, collections,
      # collections/view, recent-queries, on-this-page) that predate this
      # pipeline. Failing here would block every deploy on unrelated debt, so
      # the result is reported but does not gate. Fix those, then delete this
      # line to make lint blocking.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Test
        run: pnpm --filter api test

  deploy-api:
    name: Deploy API worker
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Schema first: the new code must never meet an older schema. Migrations
      # here are expected to be additive — a destructive one would need a
      # deliberate two-phase rollout instead. Already-applied migrations are
      # skipped, so this is safe to run on every push.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          # wranglerVersion is omitted on purpose: the action then uses the
          # version pinned in apps/api/package.json rather than a floating one.
          command: d1 migrations apply rag-db --remote

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy

  deploy-web:
    name: Deploy web app
    needs: deploy-api
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* are baked into the static bundle at build time, so they
      # must be set HERE, not at deploy time. They are public by design (see
      # apps/web/.env.example), hence repo variables rather than secrets.
      # PUBLIC_API_URL is consumed by the prebuild OpenAPI generator so the
      # docs' "Try it" console targets the deployed worker.
      - name: Build static site
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          PUBLIC_API_URL: ${{ vars.API_URL }}
        run: pnpm build

      # `wrangler` is a devDependency of apps/web so the action finds it here
      # (it is otherwise only installed in apps/api).
      # --branch main marks this the Pages "production" deployment, so it lands
      # on the stable rag-web-1qn.pages.dev URL rather than a preview URL.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: pages deploy out --project-name rag-web --branch main
